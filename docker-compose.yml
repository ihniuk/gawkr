version: '3.8'

services:
  # ============================================================
  # Gawkr AI-NVR Core (FastAPI Backend + Vite Frontend + YOLOv8)
  # ============================================================
  gawkr:
    build:
      context: .
      dockerfile: Dockerfile
    image: gawkr:latest
    container_name: gawkr
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PORT=8000
      - TZ=Europe/Dublin
      - PYTHONUNBUFFERED=1
    networks:
      - gawkr-net

networks:
  gawkr-net:
    driver: bridge
