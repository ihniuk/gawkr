<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#070a13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gawkr" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Gawkr — Having a gawk so you don't have to</title>
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var token = params.get('auth_token') || params.get('token');
          var user = params.get('user') || 'admin';
          var role = params.get('role') || 'admin';

          if (!token && window.GawkrBridge && typeof window.GawkrBridge.getAuthToken === 'function') {
            token = window.GawkrBridge.getAuthToken();
            if (window.GawkrBridge.getUsername) user = window.GawkrBridge.getUsername();
            if (window.GawkrBridge.getRole) role = window.GawkrBridge.getRole();
          }

          if (token) {
            localStorage.setItem('nvr_token', token);
            localStorage.setItem('token', token);
            localStorage.setItem('gawkr_token', token);
            localStorage.setItem('nvr_user', JSON.stringify({ username: user, role: role }));
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => console.log('SW registration skipped', err));
        });
      }
    </script>
  </body>
</html>
